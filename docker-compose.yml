services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nginx-reverse-proxy-app
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s